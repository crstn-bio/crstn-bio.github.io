# ── 01 · The question + the loop on the brain (the site's main section) ──
question:
  kicker: 01 / My question
  title: How can we learn enough of one brain to predict what happens when we intervene?
  text: The same intervention can move different brains, or one brain in different states, in different directions.
  # The loop. Step names are shared; each system below gives its own line for every step (by id).
  loop:
    model: [STATE MODEL θᵢ, one person]
    update: "↺ update θᵢ from prediction error"
    steps:
      # page: the method page (roadmap file name) the "Method →" link opens for this step
      - { id: measure, name: Measure, field: y(t), page: measure }
      - { id: estimate, name: Estimate, field: z(t), page: decode }
      - { id: predict, name: Predict · select, field: u*, page: predict }
      - { id: perturb, name: Perturb, field: u, page: control }
    closing: Every intervention is both an action and a new observation.
    formula: "predict p(y | z, u, θᵢ) → choose u* → update θᵢ from prediction error"
  # The two tabs over the brain. view: motor | memory picks the fixed camera and what is drawn.
  # steps: a few words per step (shown in the list beside the brain). now: the label on your current work.
  systems:
    - view: motor
      label: Motor · near-term testbed
      stat: { number: 25.2M, text: "people with Parkinson’s disease by 2050, more than double 2021" }
      steps:
        measure: LFP from the DBS lead
        estimate: β-burst state, for this person
        predict: the best stimulation setting
        perturb: stimulate through the same lead
      now: "NOW · a-tbTUS AT M1 (MY THESIS)"
    - view: memory
      label: Memory · long-term frontier
      stat: { number: 57M, text: "people living with dementia in 2021; Alzheimer’s is 60–70% of cases" }
      steps:
        measure: hippocampal depth electrodes (clinical)
        estimate: which memory, and what state it is in
        predict: the best moment to stimulate
        perturb: state-timed stimulation · concept
  caption: "Schematic of the method on real group-average anatomy (HCP S1200, MNI152). Not patient data, not a result."
  sources:
    - label: BMJ 2025 · GBD 2021 projections
      url: https://bmjgroup.com/cases-of-parkinsons-disease-set-to-reach-25-million-worldwide-by-2050/
    - label: WHO · dementia fact sheet
      url: https://www.who.int/news-room/fact-sheets/detail/dementia
  work_label: Work so far
  work_next: { label: "Next: estimating motor state from LFP features", url: /how/decode/ }

# ── 02 · Two systems ──
why:
  kicker: 02 / Two systems
  title: Two systems. One modelling problem.
  text: Motor circuits are the near-term testbed. Hippocampal memory is the long-term frontier. The same loop, in two very different systems.
  cards:
    - axis: Motor
      horizon: Near-term testbed
      title: Motor circuits
      number: "25.2"
      unit: M
      caption: people with Parkinson’s disease by 2050, more than double 2021
      chart: line                  # line = two points joined | dots = memory dots | none
      points: [[2021, 11.9], [2050, 25.2]]
      aim: "Measurable signals and approved adaptive stimulation: where the loop can be tested first."
      target: { label: "Target · motor circuit →", view: pd }
    - axis: Memory
      horizon: Long-term frontier
      title: Hippocampal memory
      number: "57"
      unit: M
      caption: people living with dementia in 2021; Alzheimer’s, 60–70% of cases, is the translational frontier
      chart: dots
      aim: What remains when a memory can no longer be retrieved?
      target: { label: "Target · memory circuit →", view: ad }
  bridge: "same question in both: estimate state → predict → perturb → update"
  sources:
    - label: BMJ 2025 · GBD 2021 projections
      url: https://bmjgroup.com/cases-of-parkinsons-disease-set-to-reach-25-million-worldwide-by-2050/
    - label: WHO · dementia fact sheet
      url: https://www.who.int/news-room/fact-sheets/detail/dementia

# ── Interactive brain (view = thesis | pd | ad, fixed camera views; circuit lines are drawn per view) ──
anatomy:
  title: The target is a network, not a point.
  meta: Group-average anatomy · HCP S1200 · MNI152 · drag to rotate
  questions: [Where should we measure?, Which interactions predict the response?, Where should we perturb?, What changes downstream?]
  targets:
    - view: thesis
      tab_label: Now · current work
      tab_name: Motor cortex
      tab_sub: M1 · in the motor circuit
      status: current
      title: Primary motor cortex
      text: "Target of the thesis study I work on: focused ultrasound delivered from the scalp. One node of the cortico–basal ganglia–thalamic loop."
      facts:
        - { label: Modality, text: "a-tbTUS, paired with FES" }
        - { label: Depth, text: "cortical surface, about 1–2 cm under the scalp" }
    - view: pd
      tab_label: Parkinson’s · motor
      tab_name: Deep nucleus
      tab_sub: STN · in the motor circuit
      status: question
      status_label: Translational testbed
      title: Subthalamic nucleus
      text: "A clinical DBS lead can both record local field potentials and stimulate: the testbed for adaptive control, inside the same motor loop."
      facts:
        - { label: Device, text: "lead Ø 1.27 mm, 4 contacts, drawn to scale" }
        - { label: Signal, text: "β bursts, 13–30 Hz" }
    - view: ad
      tab_label: Memory · frontier
      tab_name: Hippocampus
      tab_sub: in the memory circuit
      status: frontier
      title: Hippocampus
      text: In people, hippocampal neurons are recorded only in clinical settings; high-density probes are a discovery tool in animals. A long-term concept, not current work.
      facts:
        - { label: Probe, text: "Neuropixels 1.0 NHP Long · 45 mm · 384 of 4,416 sites" }
        - { label: Role, text: "discovery tool in animals, not a human implant" }
  # Required data acknowledgement for the HCP brain model. Keep it.
  credit: "Brain model: data provided by the Human Connectome Project, WU-Minn Consortium (Principal Investigators: David Van Essen and Kamil Ugurbil; 1U54MH091657) funded by the 16 NIH Institutes and Centers that support the NIH Blueprint for Neuroscience Research; and by the McDonnell Center for Systems Neuroscience at Washington University. HCP-MMP1.0 area 4 (Glasser et al., 2016); STN, pallidum, thalamus, entorhinal and medial prefrontal nodes at approximate literature coordinates; circuit lines are schematic. Built with [tools/brain-data ↗](https://github.com/crstn-bio/crstn-bio.github.io/tree/main/tools/brain-data)"

# ── 03 · Method: three principles + the roadmap buttons ──
approach:
  kicker: 03 / Method
  title: Less data. Better models. Minimal interfaces.
  text: Eleven questions, from measurement to restoration. Each one opens its own page.
  principles:                          # each card links to a roadmap page (its file name)
    - { title: Less data, text: rapid individual adaptation, page: personalize }
    - { title: Better model, text: predict the response to intervention, page: predict }
    - { title: Minimal interface, text: sense and perturb only what is necessary, page: minimize }
  method_label: The method · step by step   # title above the row of roadmap buttons (leave empty to hide the row)

# ── Projects (listed beside a loop step; click opens the method window) ──
#   piece:   which loop step it belongs to (measure | estimate | predict | perturb)
#   status:  current | done | build | next | question | concept | frontier
#   diagram: tus | spikes | eeg | adni | imu  (built-in method drawing) or /images/… file
projects:
  - id: thesis
    piece: perturb
    title: a-tbTUS + FES
    status: current
    summary: How perturbation changes human motor-system function.
    category: Measure · intervene
    stage: "01"
    diagram: tus
    diagram_text: "Thesis method: accelerated theta-burst transcranial ultrasound to primary motor cortex, functional electrical stimulation of the matching muscle in the same session, and the response measured before and after."
    facts:
      - { label: Role, text: "Honours thesis student and research assistant, Krembil Brain Institute, UHN" }
      - { label: Question, text: "Effects of combining a-tbTUS with functional electrical stimulation" }
  - id: mer
    piece: measure
    title: Deep-brain microelectrode recordings
    status: done
    status_label: Completed · workshop
    summary: Spikes and spectral features from deep-brain recordings.
    category: Signal processing
    stage: "02"
    diagram: spikes
    diagram_text: "Method: microelectrode recordings from four deep nuclei (Vim, STN, SNr, Rt), band-pass filtered 300 to 3000 Hz, spikes detected at minus 10 times the median absolute deviation, rasters across 115 recordings, population firing rate with a 10 ms Gaussian kernel, and LFP power spectra with Welch’s method."
    facts:
      - { label: Setting, text: "NeuroTech coding workshop" }
      - { label: Data, text: "Milosevic lab, Toronto Western Hospital (public) · LFP: Paulk et al." }
      - { label: Next, text: "state → policy → simulated stimulation (not built yet)" }
  - id: eeg
    piece: measure
    title: EEG / EMG spectral analysis
    status: done
    summary: Spectral features from scalp and muscle signals.
    category: Signal processing
    stage: "02"
    diagram: eeg
    diagram_text: "Method: EEG and EMG signals, windowed FFT, and power spectral density summarised as band power."
    facts:
      - { label: Field, text: "Behavioural neuroscience" }
  - id: adni
    piece: predict
    title: Plasma biomarkers → amyloid PET
    status: done
    summary: Visit-matched human data and out-of-sample evaluation in Alzheimer’s disease. Not memory decoding.
    category: Human data · disease modelling
    stage: "04"
    diagram: adni
    diagram_text: "Method: plasma and amyloid-PET visits matched one-to-one within participant up to 365 days; 1,524 observations from 1,236 participants; three logistic models; participant-grouped 5-fold cross-validation repeated 5 times; 1,000 participant-level bootstrap replicates. Adding Aβ42/40 raised AUC from 0.902 to 0.919 and specificity at 90% sensitivity from 0.713 to 0.803."
    facts:
      - { label: Question, text: "Does plasma Aβ42/40 add to p-tau217 for amyloid-PET positivity?" }
      - { label: Cohort, text: "1,524 observations · 1,236 participants (ADNI, Mar 2026)" }
      - { label: Result, text: "ΔAUC +0.017 (95% CI 0.010–0.026); larger in CU (+0.027) than CI (+0.012)" }
    link: { label: Full report →, url: /research/plasma-abeta/ }
  - id: imu
    piece: predict
    title: Motion-controlled pan–tilt
    status: build
    summary: A physical control loop. Not a brain–computer interface.
    category: Control-system engineering
    stage: "05"
    diagram: imu
    diagram_text: "Build: an IMU senses tilt, the angle is mapped to a servo pulse width on an Arduino UNO R3, and two SG90 servos move the pan and tilt axes."
    facts:
      - { label: Parts, text: "Arduino UNO R3 · 2 × SG90 servos · IMU · 3D-printed mount" }
      - { label: Principle, text: "sense a state → compute → act" }

# ── 04 · Open questions ──
questions:
  kicker: 04 / Open questions
  title: What I want to test next.
  next:                              # the big highlighted box (delete this block to hide it)
    label: Long-term question
    status: frontier
    lines:
      - { tag: state, text: "Can we perturb the correct state," }
      - { tag: time, text: "at the correct time," }
      - { tag: direction, text: "in the correct direction?" }
    answer: [Closed-loop, state-timed, hippocampal stimulation]
  list:                              # one question per line; empty list hides the section
    - How little individual data is needed for reliable personalization?
    - Which neural dynamics generalize across people, and which do not?
    - Can deep-brain states be inferred from less-invasive measurements?
    - Can well-chosen perturbations speed up learning one person’s dynamics?
    - Can deep targets be modulated precisely without a chronic implant?
    - Can the same framework extend from motor circuits to hippocampal memory?

