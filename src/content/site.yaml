# ── 02 · Method: three principles + the roadmap buttons ──
approach:
  kicker: 02 / Method
  title: Less data. Better models. Minimal interfaces.
  text: Eleven questions, from measurement to restoration. Each one opens its own page.
  principles:                          # each card links to a roadmap page (its file name)
    - { title: "Less, but sufficient data", text: Find the minimum information needed for reliable individual prediction., page: personalize }
    - { title: Better model, text: Predict how an individual’s brain responds to intervention., page: predict }
    - { title: Minimal interface, text: Sense and perturb only what the model actually needs., page: minimize }
  spine: [Measure, Model, Predict, Intervene, Learn]   # the main line above the step buttons
  spine_groups: [Build the model, Control]           # roadmap groups shown on the main line; the rest sit below, quieter
  method_label: The method, step by step   # title above the row of roadmap buttons (leave empty to hide the row)

# ── Projects (listed beside a loop step; click opens the method window) ──
#   piece:   which loop step it belongs to (observe | infer | predict | perturb | update)
#   date / outcome / tags: shown in the 'Work so far' list (date on the left, one-line result, method tags)
#   status:  current | done | build | next | question | concept | frontier
#   diagram: tus | spikes | eeg | adni | imu  (built-in method drawing) or /images/… file
projects:
  - id: thesis
    piece: perturb
    title: a-tbTUS + FES
    status: current
    summary: How perturbation changes human motor-system function.
    date: "Aug 2026 – now"
    outcome: "Real vs sham a-tbTUS before FES, over four visits; MEP amplitude and MDS-UPDRS Part III. Analysis in progress."
    tags: [a-tbTUS, FES, TMS–MEP, MDS-UPDRS III]
    category: Measure · intervene
    stage: "01"
    diagram: tus
    diagram_text: "Thesis design: real or sham accelerated theta-burst focused ultrasound to both primary motor cortices, three sonications 30 minutes apart, then 45 minutes of functional electrical stimulation of the arm and hand, at each of four visits; outcomes compared between visit 1 and visit 4."
    facts:
      - { label: Question, text: "Does a-tbTUS followed by FES raise corticospinal excitability and improve motor function in Parkinson’s, compared with sham?" }
      - { label: Design, text: "Randomized and sham-controlled. Real or sham a-tbTUS to both primary motor cortices (three sonications, 30 minutes apart), then 45 minutes of FES to arm and hand muscles on both sides, at each of four intervention visits." }
      - { label: Outcomes, text: "TMS resting motor threshold and MEP amplitude at the intensity giving about 1 mV; MDS-UPDRS Part III; finger tapping. Assessed at visits 1 and 4." }
      - { label: Hypothesis, text: "Real a-tbTUS with FES increases MEP amplitude and improves MDS-UPDRS Part III more than sham a-tbTUS with FES." }
      - { label: Why, text: "a-tbTUS alone increased MEP amplitude in Parkinson’s. In healthy people, one tbTUS session followed by FES gave transient inhibition, suggesting a metaplastic interaction. Multisession a-tbTUS with FES in Parkinson’s is untested." }
      - { label: Role, text: "Honours thesis student and research assistant in Dr. Robert Chen’s lab, Krembil Brain Institute, UHN. I support study sessions and the analysis of neurophysiological outcomes." }
      - { label: Status, text: "Thesis research · analysis in progress" }
  - id: mer
    piece: observe
    title: DBS signal processing
    status: done
    summary: Spikes and spectral features from deep-brain recordings.
    date: "Oct 2026"
    outcome: "Spikes and LFP spectra from 115 recordings in four deep nuclei (Vim, STN, SNr, Rt)."
    tags: [Spike detection, Welch spectra, Public data]
    category: Signal processing
    stage: "02"
    diagram: spikes
    diagram_text: "Method: microelectrode recordings from four deep nuclei (Vim, STN, SNr, Rt), band-pass filtered 300 to 3000 Hz, spikes detected at minus 10 times the median absolute deviation, rasters across 115 recordings, population firing rate with a 10 ms Gaussian kernel, and LFP power spectra with Welch’s method."
    facts:
      - { label: Data, text: "Milosevic lab, Toronto Western Hospital (public) · LFP: Paulk et al." }
      - { label: Next, text: "state → policy → simulated stimulation (not built yet)" }
  - id: eeg
    piece: observe
    title: EEG / EMG sleep-state analysis
    status: done
    summary: Sleep–wake state from mouse EEG and EMG.
    date: "Oct 2026"
    outcome: "Identified the sleep–wake state of unknown mouse recordings from EEG band power and NREM-normalized EMG."
    tags: [FFT band power, EMG normalization, Python]
    category: Signal processing
    stage: "02"
    diagram: eeg
    diagram_text: "Method: mouse EEG sampled at 1,024 Hz and EMG; FFT power summed into delta, theta, alpha, beta and gamma bands as a share of total power; EMG expressed as a percentage of each animal’s NREM mean."
    facts:
      - { label: Field, text: "Behavioural neuroscience" }
      - { label: Data, text: "Mouse EEG (1,024 Hz) and EMG with scored sleep–wake epochs; three trials per unknown recording" }
      - { label: Methods, text: "FFT band power (delta 0.5–4, theta 4–8, alpha 8–14, beta 14–30, gamma 30–100 Hz) and delta/theta ratio; EMG normalized to the animal’s own NREM mean, chosen over max or z-score normalization" }
      - { label: Result, text: "Unknown A about 100% of NREM EMG (NREM-like), B 257–370% (wake-like), C about 70%, below NREM, consistent with REM atonia" }
  - id: imu
    piece: predict
    title: Motion-controlled pan–tilt
    status: build
    summary: A physical control loop. Not a brain–computer interface.
    date: "Oct 2026"
    outcome: "A sense, compute, act loop: IMU tilt drives two servos."
    tags: [Arduino, IMU, Servo control]
    category: Control-system engineering
    stage: "05"
    diagram: imu
    diagram_text: "Build: an IMU senses tilt, the angle is mapped to a servo pulse width on an Arduino UNO R3, and two SG90 servos move the pan and tilt axes."
    facts:
      - { label: Parts, text: "Arduino UNO R3 · 2 × SG90 servos · IMU · 3D-printed mount" }
      - { label: Principle, text: "sense a state → compute → act" }

  - id: adni
    piece: predict
    title: Plasma biomarkers → amyloid PET
    status: done
    summary: Visit-matched human data and out-of-sample evaluation in Alzheimer’s disease. Not memory decoding.
    date: "Mar – Jul 2026"
    outcome: "Adding plasma Aβ42/40 to p-tau217 raised AUC from 0.902 to 0.919 (1,236 participants)."
    tags: [ADNI, Grouped cross-validation, Cluster bootstrap]
    category: Human data · disease modelling
    stage: "04"
    diagram: adni
    diagram_text: "Method: plasma and amyloid-PET visits matched one-to-one within participant up to 365 days; 1,524 observations from 1,236 participants; three logistic models; participant-grouped 5-fold cross-validation repeated 5 times; 1,000 participant-level bootstrap replicates. Adding Aβ42/40 raised AUC from 0.902 to 0.919 and specificity at 90% sensitivity from 0.713 to 0.803."
    facts:
      - { label: Question, text: "Does plasma Aβ42/40 add to p-tau217 for amyloid-PET positivity?" }
      - { label: Cohort, text: "1,524 observations · 1,236 participants (ADNI, Mar 2026)" }
      - { label: Result, text: "ΔAUC +0.017 (95% CI 0.010–0.026); larger in CU (+0.027) than CI (+0.012)" }
    link: { label: Full report →, url: /research/plasma-abeta/ }
  - id: ipsc
    piece: perturb
    title: iPSC cell replacement for Parkinson’s
    status: done
    status_label: Proposal
    summary: A graft design for Parkinson’s disease, from cell source to delivery.
    date: "Jun 2026"
    outcome: "Designed an autologous iPSC-derived A9 dopaminergic graft, delivered in a GDNF/BDNF-loaded collagen hydrogel."
    tags: [Ventral midbrain differentiation, CORIN sorting, Hydrogel delivery]
    category: Cell therapy design
    facts:
      - { label: Design, text: "Patient iPSCs, floor-plate ventral midbrain differentiation (LMX1A, FOXA2, EN1), CORIN sorting to remove serotonergic cells, stereotactic striatal delivery in an injectable hydrogel." }
      - { label: Rationale, text: "Targets the three failures of earlier grafts: poor survival, immune rejection and contamination by unwanted cell types." }
      - { label: Feasibility, text: "Checked against recent hESC and iPSC clinical trials and preclinical evidence: immune rejection, dyskinesia, manufacturing scale, long-term overgrowth risk." }
    link: { label: Full proposal →, url: /research/ipsc-parkinsons/ }

# ── 03 · What I want to test next ──
questions:
  kicker: 03 / Next
  title: What I want to test next.
  # A tiny line from current work to the frontier (delete to hide)
  path:
    - { stage: current, k: Now, v: Human motor neuromodulation }
    - { stage: next, k: Next, v: Hippocampal population dynamics }
    - { stage: long, k: Long-term, v: Individualized closed-loop memory intervention }
    - { stage: frontier, k: Frontier, v: Memory restoration }
  long:                              # the large long-term question (delete this block to hide it)
    label: Long-term question · closed-loop control
    lines:
      - { tag: state, text: "Can we perturb the correct state," }
      - { tag: time, text: "at the correct time," }
      - { tag: direction, text: "in the correct direction?" }
  next:                              # the first executable step toward it
    question: When the neurons that carry a memory drift, what stays invariant?
    formula: "y_M(t_1) ≠ y_M(t_2),  but  g(y_M(t_1)) ≈ g(y_M(t_2)) ?"
    note: Not yet conducted.
    link: { label: "The plan, step by step", url: /how/memory/ }
  others_label: Other open questions   # shown folded; click to open
  list:                              # one question per line; empty list hides the list
    - How little individual data is needed for reliable personalization?
    - Which neural dynamics generalize across people, and which do not?
    - Can deep-brain states be inferred from less-invasive measurements?
    - Can well-chosen perturbations speed up learning one person’s dynamics?
    - Can deep targets be modulated precisely without a chronic implant?
    - Can the same framework extend from motor circuits to hippocampal memory?
    - Can a tissue-like interface follow the same hippocampal neurons long enough to track one memory?

