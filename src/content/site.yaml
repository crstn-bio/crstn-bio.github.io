# ── 01 · The question + the loop on the brain (the site's main section) ──
question:
  kicker: 01 / My question
  title: How can we learn enough of one brain to predict what happens when we intervene?
  formal: What is the minimum representation of an individual’s brain state needed to predict the effect of an intervention?
  # 'Same stimulation, different responses' figure under the question (delete this block to hide it)
  variability:
    title: The same stimulation can move different people in different directions.
    text: Averaged over many people, the effect can look small. The answer is in the individual.
    labels: { stim: Same stimulation, person: One person, mean: Population average, x: Time after stimulation, y: Response, note: "Schematic, not data" }
  # The loop. Step names and formulas are shared; each system below gives its own words for every step (by id).
  # page: the method page (roadmap file name) the "Method →" link opens for that step.
  loop:
    model: [STATE MODEL θᵢ, one person]
    steps:
      - { id: observe, name: Observe, formula: "y_t", page: measure }
      - { id: infer, name: Infer, formula: "p(z_t | y_{1:t}, u_{1:t−1})", page: decode }
      - { id: predict, name: Predict, formula: "p(z_{t+1} | z_t, u_t, θ_i)", page: predict }
      - { id: perturb, name: Perturb, formula: "u_t = π(p(z_t | ·))", page: control }
      - { id: update, name: Update, formula: "p(θ_i | D) ∝ p(y_{t+1} | u_t, θ_i) p(θ_i)", page: personalize }
    closing: Every intervention is both an action and a new observation.
    formula: "predict p(y | z, u, θᵢ) → choose u* → update θᵢ from prediction error"
  # The two tabs over the brain. view: motor | memory picks the fixed camera and what is drawn.
  # stage: current | next  (shown with the maturity label). steps: a few words per step.
  # thesis: the steps your thesis actually does (marked "thesis" in the list). now: the label on the brain.
  # evidence: the compact block under the brain for this tab. Edit freely; nothing here is generated.
  systems:
    - view: motor
      stage: current
      label: Parkinson’s disease
      approach: Motor circuit neuromodulation
      stat: { number: 25.2M, text: "with Parkinson’s disease by 2050" }
      # why: one line under the tabs for this disease
      why: "The intervention already exists and the state is measurable. The open problem is choosing it for each person." 
      steps:
        observe: MEP / physiological state
        infer: this person’s current state
        predict: individual response to stimulation
        perturb: "neuromodulation: a-tbTUS + FES"
        update: revise this person’s model from the response
      thesis: [observe, perturb]
      now: a-tbTUS + FES
      # brief: one line under the brain. open: a project id (opens its window); link: a page.
      brief: { k: Current question, v: "Does a-tbTUS followed by FES raise corticospinal excitability and improve motor function in Parkinson’s, compared with sham?", status: "Thesis, Chen Lab · analysis in progress", open: thesis, button: Details }
    - view: memory
      stage: next
      label: Alzheimer’s disease
      approach: Hippocampal population dynamics
      stat: { number: 57M, text: "living with dementia (2021), 60–70% Alzheimer’s" }
      why: "No circuit intervention is approved yet, and the memory state itself is not yet defined. So the first step is to define it." 
      steps:
        observe: the same hippocampal neurons, over long periods
        infer: what stays invariant while single neurons drift
        predict: how that state responds to stimulation
        perturb: state-timed stimulation
        update: revise the model of this person
      later: [predict, perturb, update]    # shown dimmed with "later" for this tab
      brief: { k: Proposed question, v: "When the neurons that carry a memory drift, what stays invariant?", status: "Not yet conducted", link: /how/memory/, button: Method }
  caption: "Schematic on HCP S1200 group-average anatomy (MNI152). Not patient data, not a result. Drag to rotate."
  sources:
    - label: BMJ 2025 · GBD 2021 projections
      url: https://bmjgroup.com/cases-of-parkinsons-disease-set-to-reach-25-million-worldwide-by-2050/
    - label: WHO · dementia fact sheet
      url: https://www.who.int/news-room/fact-sheets/detail/dementia
  work_label: Work so far
  work_next: { label: "Estimating motor state from LFP features", url: /how/decode/, piece: infer }

# ── (Not shown on the homepage now; kept for reference) Two systems ──
why:
  kicker: 02 / Two systems
  title: Two systems. One modelling problem.
  text: Motor circuits are the near-term testbed. Hippocampal memory is the long-term frontier. The same loop, in two very different systems.
  cards:
    - axis: Motor
      horizon: Near-term testbed
      title: Motor circuits
      number: "25.2"
      unit: M
      caption: people with Parkinson’s disease by 2050, more than double 2021
      chart: line                  # line = two points joined | dots = memory dots | none
      points: [[2021, 11.9], [2050, 25.2]]
      aim: "Measurable signals and approved adaptive stimulation: where the loop can be tested first."
      target: { label: "Target · motor circuit →", view: pd }
    - axis: Memory
      horizon: Long-term frontier
      title: Hippocampal memory
      number: "57"
      unit: M
      caption: people living with dementia in 2021; Alzheimer’s, 60–70% of cases, is the translational frontier
      chart: dots
      aim: What remains when a memory can no longer be retrieved?
      target: { label: "Target · memory circuit →", view: ad }
  bridge: "same question in both: estimate state → predict → perturb → update"
  sources:
    - label: BMJ 2025 · GBD 2021 projections
      url: https://bmjgroup.com/cases-of-parkinsons-disease-set-to-reach-25-million-worldwide-by-2050/
    - label: WHO · dementia fact sheet
      url: https://www.who.int/news-room/fact-sheets/detail/dementia

